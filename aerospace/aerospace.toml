# AeroSpace Configuration
# Reference: https://nikitabobko.github.io/AeroSpace/guide

config-version = 1

# Start AeroSpace at login
start-at-login = true

# Gaps between windows
[gaps]
inner.horizontal = 10
inner.vertical   = 10
outer.left       = 10
outer.bottom     = 10
outer.top        = 10
outer.right      = 10

[mode.main.binding]
# Workspace switching
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'

# Move window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'

# Focus windows
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Layout switching
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Reload config
alt-shift-r = 'reload-config'

# --- Window Rules ---

# Vivaldi: full screen in window two
[[on-window-detected]]
if.app-id = 'com.vivaldi.Vivaldi'
run = ['move-node-to-workspace 2', 'fullscreen']

# Ghostty: window three across the whole window
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace 3', 'fullscreen']

# Slack: full screen in window four
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace 4', 'fullscreen']

# Spotify: full screen in window five
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = ['move-node-to-workspace 5', 'fullscreen']

# General catch-all: move to window one
# This rule MUST be last as AeroSpace matches in order and usually stops at the first match
# Note: we use 'check-further-callbacks = false' implicitly as it's the default.
[[on-window-detected]]
run = 'move-node-to-workspace 1'
