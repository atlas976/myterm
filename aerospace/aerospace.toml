# AeroSpace Configuration
# Reference: https://nikitabobko.github.io/AeroSpace/guide

config-version = 1

# Start AeroSpace at login
start-at-login = true

# For more then just one screen
default-root-container-orientation = 'auto'

# Gaps between windows
[gaps]
inner.horizontal = 0
inner.vertical   = 0
outer.left       = 0
outer.bottom     = 0
outer.top        = 0
outer.right      = 0

[mode.main.binding]
# Workspace switching
cmd-alt-ctrl-1 = 'workspace 1'
cmd-alt-ctrl-2 = 'workspace 2'
cmd-alt-ctrl-3 = 'workspace 3'
cmd-alt-ctrl-4 = 'workspace 4'
cmd-alt-ctrl-5 = 'workspace 5'
cmd-alt-ctrl-6 = 'workspace 6'
cmd-alt-ctrl-7 = 'workspace 7'
cmd-alt-ctrl-8 = 'workspace 8'
cmd-alt-ctrl-9 = 'workspace 9'

# Move window to workspace
cmd-alt-ctrl-shift-1 = 'move-node-to-workspace 1'
cmd-alt-ctrl-shift-2 = 'move-node-to-workspace 2'
cmd-alt-ctrl-shift-3 = 'move-node-to-workspace 3'
cmd-alt-ctrl-shift-4 = 'move-node-to-workspace 4'
cmd-alt-ctrl-shift-5 = 'move-node-to-workspace 5'
cmd-alt-ctrl-shift-6 = 'move-node-to-workspace 6'
cmd-alt-ctrl-shift-7 = 'move-node-to-workspace 7'
cmd-alt-ctrl-shift-8 = 'move-node-to-workspace 8'
cmd-alt-ctrl-shift-9 = 'move-node-to-workspace 9'

# Focus windows
cmd-alt-ctrl-h = 'focus left'
cmd-alt-ctrl-j = 'focus down'
cmd-alt-ctrl-k = 'focus up'
cmd-alt-ctrl-l = 'focus right'

# Move windows
cmd-alt-ctrl-shift-h = 'move left'
cmd-alt-ctrl-shift-j = 'move down'
cmd-alt-ctrl-shift-k = 'move up'
cmd-alt-ctrl-shift-l = 'move right'

# Layout switching
cmd-alt-ctrl-f = 'fullscreen'
cmd-alt-ctrl-shift-space = 'layout floating tiling' # Toggle floating
cmd-alt-ctrl-comma = 'layout accordion'

# --- Window Rules ---

# Vivaldi: route to workspace 1
[[on-window-detected]]
if.app-id = 'com.vivaldi.Vivaldi'
run = ['move-node-to-workspace 1']

# Ghostty: route to workspace 3 as a floating window
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['layout floating', 'move-node-to-workspace 3']
# run = ['move-node-to-workspace 3', 'fullscreen']

# Communication apps: route to workspace 2
# Outlook: keep left in the accordion layout
[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = ['move-node-to-workspace 2', 'layout accordion', 'move left', 'move left']

# Slack: keep the default accordion position
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace 2', 'layout accordion']

# WhatsApp: keep right in the accordion layout
[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = ['move-node-to-workspace 2', 'layout accordion', 'move right', 'move right']

# Spotify: route to workspace 4
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = ['move-node-to-workspace 4']

# General catch-all: move to workspace 5
# This rule MUST be last as AeroSpace matches in order and usually stops at the first match
# Note: we use 'check-further-callbacks = false' implicitly as it's the default.
[[on-window-detected]]
run = ['layout floating', 'move-node-to-workspace 5']
