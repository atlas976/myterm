# AeroSpace Configuration
# Reference: https://nikitabobko.github.io/AeroSpace/guide

config-version = 1

# Start AeroSpace at login
start-at-login = true

# For more then just one screen
default-root-container-orientation = 'auto'

# Gaps between windows
[gaps]
inner.horizontal = 0
inner.vertical   = 0
outer.left       = 0
outer.bottom     = 0
outer.top        = 0
outer.right      = 0

[mode.main.binding]
# Workspace switching
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Focus windows
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Layout switching
alt-f = 'fullscreen'
alt-shift-space = 'layout floating tiling' # Toggle floating
alt-comma = 'layout accordion'

# --- Window Rules ---

# Vivaldi: full screen in window one
[[on-window-detected]]
if.app-id = 'com.vivaldi.Vivaldi'
run = ['move-node-to-workspace 1']

# Ghostty: window three across the whole window
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['layout floating', 'move-node-to-workspace 3']
# run = ['move-node-to-workspace 3', 'fullscreen']

# Communication in 2
# Outlook wird immer mit Gewalt ganz nach links geschoben
[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = ['move-node-to-workspace 2', 'layout accordion', 'move left', 'move left']

# Slack bleibt normal
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace 2', 'layout accordion']

# WhatsApp wird immer mit Gewalt ganz nach rechts geschoben
[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = ['move-node-to-workspace 2', 'layout accordion', 'move right', 'move right']

# Spotify: full screen in window five
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = ['move-node-to-workspace 4']

# General catch-all: move to window five
# This rule MUST be last as AeroSpace matches in order and usually stops at the first match
# Note: we use 'check-further-callbacks = false' implicitly as it's the default.
[[on-window-detected]]
run = ['layout floating', 'move-node-to-workspace 5']
